<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <meta name="description" content="四則演算ができるシンプルな計算機です。">
    <title>計算機 | ホームページ</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        color: #20243a;
        background: #f7f8fc;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .site-header,
      main,
      .site-footer {
        width: min(100% - 48px, 1080px);
        margin-inline: auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 88px;
      }

      .brand {
        color: #20243a;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-decoration: none;
      }

      .header-note,
      .back-link {
        color: #74798d;
        font-size: 0.875rem;
      }

      main {
        display: grid;
        min-height: calc(100svh - 160px);
        align-items: center;
        justify-items: center;
        padding-block: 32px 64px;
      }

      .calculator {
        width: min(100%, 400px);
        padding: 32px;
        border: 1px solid #e9eaf2;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(40 46 90 / 8%);
      }

      .calculator-heading {
        margin: 0 0 8px;
        font-size: 1.5rem;
        letter-spacing: -0.04em;
      }

      .calculator-description {
        margin: 0 0 24px;
        color: #74798d;
        font-size: 0.875rem;
      }

      .display {
        width: 100%;
        min-height: 76px;
        margin-bottom: 16px;
        padding: 14px 16px;
        overflow: hidden;
        border: 1px solid #e9eaf2;
        border-radius: 14px;
        background: #f7f8fc;
        color: #20243a;
        font: inherit;
        font-size: clamp(2rem, 9vw, 2.75rem);
        font-variant-numeric: tabular-nums;
        text-align: right;
        text-overflow: ellipsis;
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .key {
        min-height: 58px;
        border: 0;
        border-radius: 14px;
        background: #f0f1f8;
        color: #292d43;
        cursor: pointer;
        font: inherit;
        font-size: 1.125rem;
        font-weight: 700;
        transition: background-color 140ms ease, transform 140ms ease;
      }

      .key:hover {
        transform: translateY(-1px);
        background: #e6e7f2;
      }

      .key:active {
        transform: translateY(0);
      }

      .key:focus-visible,
      .brand:focus-visible,
      .back-link:focus-visible {
        outline: 3px solid #a59bf5;
        outline-offset: 3px;
      }

      .key-utility {
        background: #e9e8f8;
        color: #5a4dbb;
      }

      .key-operator,
      .key-equals {
        background: #6254c7;
        color: #fff;
      }

      .key-operator:hover,
      .key-equals:hover {
        background: #5043b0;
      }

      .key-zero {
        grid-column: span 2;
      }

      .back-link {
        display: inline-block;
        margin-top: 20px;
        text-decoration: none;
      }

      .back-link:hover {
        color: #5043b0;
        text-decoration: underline;
      }

      .site-footer {
        display: flex;
        justify-content: space-between;
        padding-block: 20px 28px;
        border-top: 1px solid #e7e8ef;
        color: #85899a;
        font-size: 0.8125rem;
      }

      .site-footer p {
        margin: 0;
      }

      @media (max-width: 600px) {
        .site-header,
        main,
        .site-footer {
          width: min(100% - 32px, 1080px);
        }

        .site-header {
          min-height: 72px;
        }

        main {
          min-height: calc(100svh - 144px);
          padding-block: 24px 40px;
        }

        .calculator {
          padding: 24px;
          border-radius: 20px;
        }

        .site-footer {
          gap: 12px;
          flex-wrap: wrap;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <link rel="stylesheet" href="page-transition.css">
  </head>
  <body>
    <div class="loading-curtain" aria-hidden="true">
      <div class="loading-curtain-panel"></div>
      <div class="loading-curtain-panel"></div>
    </div>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="ホーム">HOME<span aria-hidden="true">.</span></a>
      <span class="header-note">計算機</span>
    </header>
    <main>
      <section class="calculator" aria-labelledby="calculator-title">
        <h1 class="calculator-heading" id="calculator-title">計算機</h1>
        <p class="calculator-description">四則演算を手軽に計算できます。</p>
        <input class="display" id="display" type="text" value="0" aria-label="計算結果" readonly>
        <div class="keypad" aria-label="計算機のキー">
          <button class="key key-utility" type="button" data-action="clear" aria-label="クリア">AC</button>
          <button class="key key-utility" type="button" data-action="backspace" aria-label="一文字削除">⌫</button>
          <button class="key key-utility" type="button" data-action="operator" data-value="/" aria-label="割る">÷</button>
          <button class="key key-operator" type="button" data-action="operator" data-value="*" aria-label="掛ける">×</button>
          <button class="key" type="button" data-action="digit" data-value="7">7</button>
          <button class="key" type="button" data-action="digit" data-value="8">8</button>
          <button class="key" type="button" data-action="digit" data-value="9">9</button>
          <button class="key key-operator" type="button" data-action="operator" data-value="-" aria-label="引く">−</button>
          <button class="key" type="button" data-action="digit" data-value="4">4</button>
          <button class="key" type="button" data-action="digit" data-value="5">5</button>
          <button class="key" type="button" data-action="digit" data-value="6">6</button>
          <button class="key key-operator" type="button" data-action="operator" data-value="+" aria-label="足す">+</button>
          <button class="key" type="button" data-action="digit" data-value="1">1</button>
          <button class="key" type="button" data-action="digit" data-value="2">2</button>
          <button class="key" type="button" data-action="digit" data-value="3">3</button>
          <button class="key key-operator" type="button" data-action="sign" aria-label="正負を切り替え">±</button>
          <button class="key key-zero" type="button" data-action="digit" data-value="0">0</button>
          <button class="key" type="button" data-action="decimal" aria-label="小数点">.</button>
          <button class="key key-equals" type="button" data-action="equals" aria-label="イコール">=</button>
        </div>
        <a class="back-link" href="index.html">← ホームに戻る</a>
      </section>
    </main>
    <footer class="site-footer">
      <p><small>&copy; 2026 ホームページ</small></p>
      <p><small>このページの内容は自由に編集できます。</small></p>
    </footer>
    <script src="page-transition.js"></script>
    <script>
      const display = document.querySelector("#display");
      const keypad = document.querySelector(".keypad");
      let currentInput = "0";
      let storedValue = null;
      let pendingOperator = null;
      let shouldStartNewInput = false;

      function render() {
        display.value = currentInput;
      }

      function clear() {
        currentInput = "0";
        storedValue = null;
        pendingOperator = null;
        shouldStartNewInput = false;
        render();
      }

      function enterDigit(digit) {
        if (shouldStartNewInput || currentInput === "エラー") {
          currentInput = digit;
          shouldStartNewInput = false;
        } else if (currentInput === "0") {
          currentInput = digit;
        } else if (currentInput.replace("-", "").length < 15) {
          currentInput += digit;
        }
        render();
      }

      function enterDecimal() {
        if (shouldStartNewInput || currentInput === "エラー") {
          currentInput = "0.";
          shouldStartNewInput = false;
        } else if (!currentInput.includes(".")) {
          currentInput += ".";
        }
        render();
      }

      function calculate(left, right, operator) {
        switch (operator) {
          case "+": return left + right;
          case "-": return left - right;
          case "*": return left * right;
          case "/": return right === 0 ? null : left / right;
          default: return right;
        }
      }

      function formatResult(value) {
        if (!Number.isFinite(value)) {
          return null;
        }
        return String(Number(value.toPrecision(12)));
      }

      function chooseOperator(operator) {
        if (currentInput === "エラー") return;
        const value = Number(currentInput);
        if (pendingOperator && !shouldStartNewInput) {
          const result = calculate(storedValue, value, pendingOperator);
          const formatted = result === null ? null : formatResult(result);
          if (formatted === null) {
            currentInput = "エラー";
            storedValue = null;
            pendingOperator = null;
            shouldStartNewInput = true;
            render();
            return;
          }
          currentInput = formatted;
        }
        storedValue = Number(currentInput);
        pendingOperator = operator;
        shouldStartNewInput = true;
        render();
      }

      function equals() {
        if (!pendingOperator || storedValue === null || shouldStartNewInput || currentInput === "エラー") {
          return;
        }
        const result = calculate(storedValue, Number(currentInput), pendingOperator);
        const formatted = result === null ? null : formatResult(result);
        currentInput = formatted === null ? "エラー" : formatted;
        storedValue = null;
        pendingOperator = null;
        shouldStartNewInput = true;
        render();
      }

      function handleAction(action, value) {
        if (action === "digit") enterDigit(value);
        if (action === "decimal") enterDecimal();
        if (action === "operator") chooseOperator(value);
        if (action === "equals") equals();
        if (action === "clear") clear();
        if (action === "backspace") {
          if (shouldStartNewInput || currentInput === "エラー") {
            currentInput = "0";
            shouldStartNewInput = false;
          } else {
            currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : "0";
            if (currentInput === "-") currentInput = "0";
          }
          render();
        }
        if (action === "sign" && currentInput !== "0" && currentInput !== "エラー") {
          currentInput = currentInput.startsWith("-") ? currentInput.slice(1) : `-${currentInput}`;
          render();
        }
      }

      keypad.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        handleAction(button.dataset.action, button.dataset.value);
      });

      document.addEventListener("keydown", (event) => {
        if (/^\d$/.test(event.key)) handleAction("digit", event.key);
        else if (event.key === ".") handleAction("decimal");
        else if (["+", "-", "*", "/"].includes(event.key)) handleAction("operator", event.key);
        else if (event.key === "Enter" || event.key === "=") handleAction("equals");
        else if (event.key === "Backspace") handleAction("backspace");
        else if (event.key === "Escape") handleAction("clear");
        else return;
        event.preventDefault();
      });
    </script>
  </body>
</html>
